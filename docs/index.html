
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场情绪画板 · 2026-11-13</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0a0e17; --panel:#111827; --panel2:#0f1623; --line:#1f2b3e;
    --txt:#e6edf6; --sub:#8b9bb4; --up:#ef4444; --down:#22c55e;
    --accent:#38bdf8; --gold:#fbbf24; --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:28px 22px 48px;line-height:1.5}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px;flex-wrap:wrap;gap:10px}
  h1{font-size:24px;font-weight:700;letter-spacing:.5px}
  h1 .tag{color:var(--accent)}
  .meta{font-size:13px;color:var(--sub);text-align:right}
  .meta b{color:var(--txt);font-size:16px;font-variant-numeric:tabular-nums}
  .grid{display:grid;gap:16px}
  .kpi{grid-template-columns:repeat(4,1fr)}
  .row2{grid-template-columns:1fr 1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
  .kpi .label{font-size:13px;color:var(--sub);margin-bottom:8px}
  .kpi .val{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:14px;color:var(--sub);font-weight:400;margin-left:4px}
  .kpi .sub{font-size:12px;color:var(--sub);margin-top:6px}
  .up{color:var(--up)} .down{color:var(--down)} .accent{color:var(--accent)} .gold{color:var(--gold)}
  .card h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h3::before{content:"";width:4px;height:15px;background:var(--accent);border-radius:2px}
  .chart{width:100%;height:300px}
  .opt-grid{grid-template-columns:repeat(5,1fr)}
  .opt{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .opt .nm{font-size:13px;color:var(--sub);margin-bottom:8px}
  .opt .pcr{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .opt .iv{font-size:12px;color:var(--sub);margin-top:6px}
  .bar{height:5px;background:#1a2433;border-radius:3px;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet))}
  footer{margin-top:26px;color:var(--sub);font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:14px}
  @media(max-width:880px){.kpi{grid-template-columns:repeat(2,1fr)}.row2,.opt-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="tag">▮</span> 市场情绪画板 <span style="color:var(--sub);font-size:15px;font-weight:400">非交易时段复盘</span></h1>
    <div class="meta">最近交易日 <b>2026-11-13</b><br>生成于 2026-11-13 16:50</div>
  </header>

  <div class="grid kpi">
    <div class="card"><div class="label">全市场成交额</div>
      <div class="val accent">16,586<small>亿元</small></div>
      <div class="sub">沪深两市当日合计</div></div>
    <div class="card"><div class="label">上涨占比</div>
      <div class="val up">14.27<small>%</small></div>
      <div class="sub">共 5,222 只个股参与统计</div></div>
    <div class="card"><div class="label">涨停 / 跌停</div>
      <div class="val"><span class="up">38</span> <small>/</small> <span class="down">46</span></div>
      <div class="sub">连板晋级率 18.42%</div></div>
    <div class="card"><div class="label">市场宽度</div>
      <div class="val"><span class="up">745</span> <small>/</small> <span class="down">4420</span></div>
      <div class="sub">上涨 / 下跌家数</div></div>
  </div>

  <div class="grid row2" style="margin-top:16px">
    <div class="card"><h3>市场广度分布</h3><div id="breadth" class="chart"></div></div>
    <div class="card"><h3>涨跌停与连板晋级</h3><div id="extreme" class="chart"></div></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>衍生品 · 宽基 ETF 期权 PCR(量) 与 平均 IV</h3>
    <div class="grid opt-grid" id="opts"></div>
    <div id="pcr" class="chart" style="margin-top:14px"></div>
  </div>

  <footer>数据来源：iFinD · THS_HQ / THS_DR / THS_RQ ｜ 本页为静态快照，更新请重跑脚本后 git push</footer>
</div>

<script>
const PANEL = {"up": 745, "down": 4420, "flat": 57, "total": 5222, "zt": 38, "dt": 46, "promo_rate": 18.42, "options": [{"name": "上证50", "pcr": 0.771, "iv": 17.2}, {"name": "沪深300", "pcr": 0.801, "iv": 25.07}, {"name": "科创50", "pcr": 0.396, "iv": 51.4}, {"name": "创业板", "pcr": 0.844, "iv": 47.62}, {"name": "中证1000", "pcr": 0.813, "iv": 37.73}]};
const dark = {bg:'transparent',txt:'#e6edf6',sub:'#8b9bb4',line:'#1f2b3e'};

const b = echarts.init(document.getElementById('breadth'));
b.setOption({backgroundColor:dark.bg,textStyle:{color:dark.txt},
  tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
  legend:{bottom:0,textStyle:{color:dark.sub},itemWidth:12,itemHeight:12},
  series:[{type:'pie',radius:['52%','76%'],center:['50%','45%'],
    itemStyle:{borderColor:dark.bg,borderWidth:3},
    label:{color:dark.txt,formatter:'{d}%'},
    data:[
      {value:PANEL.up,name:'上涨',itemStyle:{color:'#ef4444'}},
      {value:PANEL.down,name:'下跌',itemStyle:{color:'#22c55e'}},
      {value:PANEL.flat,name:'平盘',itemStyle:{color:'#64748b'}}
    ]}]});

const e = echarts.init(document.getElementById('extreme'));
e.setOption({backgroundColor:dark.bg,textStyle:{color:dark.txt},
  grid:{left:48,right:30,top:30,bottom:30},
  tooltip:{},
  xAxis:{type:'category',data:['涨停','跌停','连板晋级率(%)'],
    axisLine:{lineStyle:{color:dark.line}},axisLabel:{color:dark.sub}},
  yAxis:{type:'value',splitLine:{lineStyle:{color:dark.line}},axisLabel:{color:dark.sub}},
  series:[{type:'bar',barWidth:46,itemStyle:{borderRadius:[6,6,0,0]},
    data:[
      {value:PANEL.zt,itemStyle:{color:'#ef4444'}},
      {value:PANEL.dt,itemStyle:{color:'#22c55e'}},
      {value:PANEL.promo_rate,itemStyle:{color:'#38bdf8'}}
    ],label:{show:true,position:'top',color:dark.txt}}]});

const opts = document.getElementById('opts');
PANEL.options.forEach(o=>{
  const pct = Math.min(100, o.pcr/1.2*100);
  opts.insertAdjacentHTML('beforeend',
    `<div class="opt"><div class="nm">${o.name}</div>
      <div class="pcr">PCR ${o.pcr.toFixed(3)}</div>
      <div class="iv">平均 IV ${o.iv.toFixed(2)}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`);
});

const p = echarts.init(document.getElementById('pcr'));
const names = PANEL.options.map(o=>o.name);
p.setOption({backgroundColor:dark.bg,textStyle:{color:dark.txt},
  grid:{left:50,right:60,top:40,bottom:30},
  tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
  legend:{top:0,textStyle:{color:dark.sub},data:['PCR(量)','平均IV(%)']},
  xAxis:{type:'category',data:names,axisLine:{lineStyle:{color:dark.line}},axisLabel:{color:dark.sub}},
  yAxis:[
    {type:'value',name:'PCR',max:1.2,splitLine:{lineStyle:{color:dark.line}},axisLabel:{color:dark.sub}},
    {type:'value',name:'IV%',position:'right',splitLine:{show:false},axisLabel:{color:dark.sub}}
  ],
  series:[
    {name:'PCR(量)',type:'bar',barWidth:34,itemStyle:{color:'#38bdf8',borderRadius:[6,6,0,0]},
      data:PANEL.options.map(o=>o.pcr),label:{show:true,position:'top',color:dark.txt,formatter:v=>v.value.toFixed(2)}},
    {name:'平均IV(%)',type:'line',yAxisIndex:1,symbolSize:9,lineStyle:{width:3,color:'#a78bfa'},itemStyle:{color:'#a78bfa'},
      data:PANEL.options.map(o=>o.iv)}
  ]});

window.addEventListener('resize',()=>{b.resize();e.resize();p.resize();});
</script>
</body>
</html>
